name: 24/7 livestream relay

on:
  workflow_dispatch:
    inputs:
      stream_minutes:
        description: "Minutes for this segment (maximum 285)."
        required: false
        default: "285"
        type: string
  # Recovery only: the normal path dispatches its successor itself.
  schedule:
    - cron: "0 */5 * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: buddhist-music-livestream
  cancel-in-progress: false

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 310
    env:
      RTMP_URL: ${{ secrets.RTMP_URL }}
      STREAM_KEY: ${{ secrets.STREAM_KEY }}
      FULL_RTMP_URL: ${{ secrets.FULL_RTMP_URL }}
      STREAM_MINUTES: ${{ inputs.stream_minutes || '285' }}
      RESERVE_SECONDS: "120"
      RESTART_DELAY: "10"
    steps:
      - uses: actions/checkout@v4

      - name: Validate private stream settings
        run: |
          if [ -z "$FULL_RTMP_URL" ] && { [ -z "$RTMP_URL" ] || [ -z "$STREAM_KEY" ]; }; then
            echo 'Set FULL_RTMP_URL or both RTMP_URL and STREAM_KEY as Actions secrets.' >&2
            exit 2
          fi
          case "$STREAM_MINUTES" in
            ''|*[!0-9]*) echo 'stream_minutes must be an integer.' >&2; exit 2 ;;
          esac
          if [ "$STREAM_MINUTES" -lt 1 ] || [ "$STREAM_MINUTES" -gt 285 ]; then
            echo 'stream_minutes must be between 1 and 285.' >&2
            exit 2
          fi
          test -f assets/background.png
          test -f assets/music.mp3

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Stream this segment
        run: sh scripts/run-github-actions.sh

      - name: Dispatch next segment
        # The dispatched run queues behind this run and starts as soon as this
        # runner exits. Scheduled runs are a fallback if dispatch ever fails.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run github-livestream.yml --ref main -f stream_minutes=285
